[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "begins"
description = "Command line programs for busy developers"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    { name = "Aaron Iles", email = "aaron.iles@gmail.com" },
]
maintainers = [
    { name = "trollkarlen" },
]
requires-python = ">=3.11"
dynamic = ["version"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=6",
    "ruff>=0.12",
    "black>=25",
    "pylint>=3.3",
    "mypy>=1.14",
]

[tool.hatch.version]
path = "begin/version.py"

[tool.hatch.build.targets.wheel]
packages = ["begin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --cov=begin --cov-report=term-missing --cov-fail-under=80"

[tool.coverage.run]
source = ["begin"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
line-length = 220
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4"]

[tool.ruff.lint.per-file-ignores]
# String annotations are begins' help-text feature; env manipulation is
# normal test practice.
"tests/*" = ["F722", "B003", "B006"]
# Sphinx config and doc examples follow their own conventions.
"docs/*" = ["E402", "F722", "F401", "I001"]

[tool.black]
line-length = 220

[tool.pylint.main]
py-version = "3.11"

[tool.pylint.format]
max-line-length = 220

[tool.pylint."messages control"]
disable = [
    "too-few-public-methods",
    "too-many-arguments",
    "too-many-positional-arguments",
    "duplicate-code",
    "fixme",
    # The execution-context object creates its attributes dynamically via the
    # swizzle protocol in begin/context.py, so static analysis cannot see
    # "return_values" / "opts_previous" / "opts_next".
    "no-member",
    # begins extends argparse internals by design: it reads the subparser
    # "_subcommand" dest it creates itself and overrides HelpFormatter
    # mixin methods that call argparse._format_action.
    "protected-access",
]

[tool.pylint.design]
# create_parser() wires nine parser knobs plus extension plumbing; 17 locals
# is inherent to the design, not a smell.
max-locals = 20

[tool.mypy]
files = ["begin"]
python_version = "3.11"
ignore_missing_imports = true
